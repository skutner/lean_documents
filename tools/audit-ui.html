const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function guard(fn){return(...args)=>{if(args[0]?.type==='submit')args[0].preventDefault();return Promise.resolve().then(()=>fn(...args)).catch(fail);};}
async function api(url,data){const r=await fetch(url,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.statusText);return j;}
function languageLabel(code){return code==='ro'?'Română':'English';}
function exampleFolder(x){return (x.folder||'examples/'+x.id).replace(/\/$/,'')+'/';}
function runFolder(r){return (r.folder||'tmp/audit-runs/'+r.id).replace(/\/$/,'')+'/';}
function reportName(x,p){return x.reports.find(r=>r.path===p)?.label||p;}
function fileURL(scope,p,extra='',id=null){return '/api/file?'+scope+'='+encodeURIComponent(id||(scope==='run'?run.id:ex.id))+'&path='+encodeURIComponent(p)+extra;}
function button(text,fn,className=''){const b=document.createElement('button');b.textContent=text;b.className=className;b.onclick=guard(fn);return b;}
function headingId(t){return 'md-'+t.toLowerCase().replace(/<[^>]*>/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');}
function inline(t){
 const token=/(`+)([\s\S]*?)\1|!?\[([^\]]+)\]\((<[^>]+>|[^\s)]+)(?:\s+"[^"]*")?\)|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*\n]+)\*|_([^_\n]+)_/g;let html='',at=0;
 for(const m of String(t).matchAll(token)){html+=esc(t.slice(at,m.index));at=m.index+m[0].length;
  if(m[1])html+='<code>'+esc(m[2])+'</code>';
  else if(m[3]){const href=m[4].replace(/^<|>$/g,'');const label=m[3].includes('/')?esc(artifactTitle(m[3]))+'<span class="path">'+esc(m[3])+'</span>':esc(m[3]);html+=/^(?:[a-z][a-z\d+.-]*:|\/\/)/i.test(href)?label:'<a href="#" data-md-link="'+esc(href)+'">'+label+'</a>';}
  else if(m[5]||m[6])html+='<strong>'+esc(m[5]||m[6])+'</strong>';else html+='<em>'+esc(m[7]||m[8])+'</em>';
 }return html+esc(t.slice(at));

function markdown(text){
 const lines=String(text).replace(/\r\n?/g,'\n').split('\n');let html='',i=0;
 const cells=line=>line.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'));
 const divider=line=>/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line||'');
 const list=line=>/^(\s*)([-+*]|\d+[.)])\s+(.*)$/.exec(line||'');
 const boundary=(line,next)=>/^\s*(?:#{1,6}\s|>|`{3,}|~{3,}|(?:[-*_]\s*){3,}$)/.test(line)||!!list(line)||(line.includes('|')&&divider(next));
 while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue;}const anchor=/^\s*<a\s+id=["']([\w.-]+)["']\s*><\/a>\s*$/.exec(line);if(anchor){html+='<span id="'+esc(anchor[1])+'"></span>';i++;continue;}
  const fence=/^\s*(`{3,}|~{3,})(.*)$/.exec(line);if(fence){const chunks=[];i++;while(i<lines.length&&!new RegExp('^\\s*'+fence[1][0]+'{'+fence[1].length+',}\\s*$').test(lines[i]))chunks.push(lines[i++]);if(i<lines.length)i++;html+='<pre><code>'+esc(chunks.join('\n'))+'</code></pre>';continue;}
  const h=/^\s*(#{1,6})\s+(.*?)(?:\s+#+\s*)?$/.exec(line);if(h){const anchor=/^([RS]\d+)\b/.exec(h[2]);if(anchor)html+='<span id="'+esc(headingId(anchor[1]))+'"></span>';html+='<h'+h[1].length+' id="'+esc(headingId(h[2]))+'">'+inline(h[2])+'</h'+h[1].length+'>';i++;continue;}
  if(/^\s*(?:[-*_]\s*){3,}$/.test(line)){html+='<hr>';i++;continue;}
  if(/^\s*>/.test(line)){const block=[];while(i<lines.length&&/^\s*>/.test(lines[i]))block.push(lines[i++].replace(/^\s*> ?/,''));html+='<blockquote>'+markdown(block.join('\n'))+'</blockquote>';continue;}
  if(line.includes('|')&&divider(lines[i+1])){const heads=cells(line);html+='<table><thead><tr>'+heads.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<lines.length&&lines[i].trim()&&lines[i].includes('|'))html+='<tr>'+cells(lines[i++]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';html+='</tbody></table>';continue;}
  const first=list(line);if(first){const indent=first[1].length,ordered=/\d/.test(first[2]),tag=ordered?'ol':'ul';html+='<'+tag+(ordered?' start="'+parseInt(first[2],10)+'"':'')+'>';
   while(i<lines.length){const item=list(lines[i]);if(!item||item[1].length!==indent||/\d/.test(item[2])!==ordered)break;const body=[item[3]];i++;
    while(i<lines.length&&lines[i].trim()&&((/^\s*/.exec(lines[i])[0].length)>indent)){body.push(lines[i].slice(Math.min(lines[i].search(/\S/),indent+2)));i++;}
    html+='<li>'+markdown(body.join('\n'))+'</li>';
   }html+='</'+tag+'>';continue;}
  const paragraph=[line];i++;while(i<lines.length&&lines[i].trim()&&!boundary(lines[i],lines[i+1]))paragraph.push(lines[i++]);html+='<p>'+inline(paragraph.join('\n')).replace(/ {2}\n/g,'<br>')+'</p>';
 }return html;
}
function resolveDocumentLink(base,href){
 if(/^(?:[a-z][a-z\d+.-]*:|\/\/)/i.test(href))throw Error('Only local artifact links can be opened here.');
 const hashAt=href.indexOf('#'),fragment=hashAt<0?'':decodeURIComponent(href.slice(hashAt+1));const raw=decodeURIComponent((hashAt<0?href:href.slice(0,hashAt)).split('?')[0]);
 if(!raw)return {path:base,fragment};if(raw.startsWith('/')||raw.includes('\\')||raw.includes('\0'))throw Error('The artifact link must stay inside the selected folder.');
 const parts=base.split('/').slice(0,-1);for(const segment of raw.split('/')){if(!segment||segment==='.')continue;if(segment==='..'){if(!parts.length)throw Error('The artifact link escapes the selected folder.');parts.pop();}else parts.push(segment);}return {path:parts.join('/'),fragment};
}
function bindMarkdownLinks(container,scope,base,target,sourceId){
 for(const link of container.querySelectorAll('[data-md-link]'))link.onclick=event=>{event.preventDefault();return guard(async()=>{const ref=resolveDocumentLink(base,link.dataset.mdLink);if(ref.path===base&&ref.fragment){const heading=[...container.querySelectorAll('[id]')].find(e=>e.id===ref.fragment||e.id===headingId(ref.fragment));heading?.scrollIntoView({block:'nearest'});return;}await preview(scope,ref.path,target,0,null,sourceId);if(ref.fragment){const heading=[...target.querySelectorAll('[id]')].find(e=>e.id===ref.fragment||e.id===headingId(ref.fragment));heading?.scrollIntoView({block:'nearest'});}})();};
}
function artifactTitle(p){const name=p.split('/').pop();return /\.lean$/i.test(name)?name:name.replace(/\.(md|jsonl?|log)$/i,'').replace(/[-_]/g,' ').replace(/^./,c=>c.toUpperCase());}

function artifactPath(p){if(!p)return '';if(run.files.some(f=>f.path===p))return p;const prefix=run.findingsPath?.replace(/(?:findings\.json|claims\.md)$/,'')||'';return prefix+p;}
function proofPath(p){if(p.path)return artifactPath(p.path);const candidates=[p.module,p.module+'.lean','models/'+p.module.replaceAll('.','/')+'.lean'];for(const candidate of candidates){const found=artifactPath(candidate);if(run.files.some(f=>f.path===found))return found;}return artifactPath('models/'+p.module.replaceAll('.','/')+'.lean');}

function relevantEvents(phase){return run.phases.filter(e=>selectedClaim?e.claim_ids?.length===1&&e.claim_ids[0]===selectedClaim&&e.claim_step===phase:e.phase===phase);}
function narrativeDocuments(f){
 if(!run)return [];const docs=[];const title=ex.language==='ro'?'Analiza completă':'Full analysis';if(f?.path&&/\.md$/i.test(f.path))docs.push({label:title,path:artifactPath(f.path)});
 const labels=ex.language==='ro'?['Afirmație','Dovezi','Analiză','Verificare','Verdict']:['Claim','Evidence','Analysis','Checks','Verdict'];
 const stepIds=['registration','evidence','analysis','verification','verdict'];for(const [i,step] of stepIds.entries()){const entries=run.phases.filter(e=>e.claim_ids?.length===1&&e.claim_ids[0]===f?.claim_id&&e.claim_step===step&&e.path&&/\.md$/i.test(e.path));entries.forEach((event,n)=>docs.push({label:labels[i]+(entries.length>1?' '+(n+1):''),path:artifactPath(event.path)}));}

async function preview(scope,p,target,offset=0,expectedHash=null,lockedId=null){

 const version=++previewSeq;target.dataset.request=String(version);target.innerHTML='<p class="muted">Loading '+esc(p)+'…</p>';const sourceId=lockedId||(scope==='run'?run.id:ex.id);const r=await api(fileURL(scope,p,'&offset='+offset+(expectedHash?'&hash=1':''),sourceId));if(!target.isConnected||target.dataset.request!==String(version))return;target.dataset.artifactPath=p;target.dataset.sourceId=sourceId;target.dataset.scope=scope;selectedDocument={scope,path:p,id:sourceId};drawTree();
 const head='<div class="row between"><div><h3>'+esc(artifactTitle(p))+'</h3><span class="path">'+esc(p)+'</span></div><a href="'+fileURL(scope,p,'&download=1',sourceId)+'">Download</a></div>'+(expectedHash?'<p class="tag '+(expectedHash===r.sha256?'supported':'undetermined')+'">'+(expectedHash===r.sha256?'Matches recorded artifact hash':'Changed since this event; this is not the recorded version')+'</p>':'');

  model.disabled=false;renderEfforts();
 }catch(e){if(f.isConnected){model.innerHTML='<option value="">Models unavailable</option>';st.textContent=e.message;}}finally{agentControls();}}
function renderEfforts(){const f=$('agent-form'),levels=agentModels.find(m=>m.id===f.elements.model.value)?.efforts||[],keep=f.elements.agent.value===agentState.agent&&f.elements.model.value===agentState.model?agentState.effort:'',e=f.elements.effort;e.innerHTML='';e.append(new Option(levels.length?'Agent default':f.elements.model.value?'Not adjustable for this model':'Choose a model first',''));for(const l of levels)e.append(new Option(l,l));e.value=levels.includes(keep)?keep:'';e.disabled=!levels.length;agentControls();}
function bindAgentForm(){const f=$('agent-form');f.elements.agent.onchange=guard(()=>loadModels(f.elements.agent.value===agentState.agent?agentState.model:''));f.elements.model.onchange=renderEfforts;$('agent-reload').onclick=guard(()=>loadAgents(true));f.onsubmit=guard(()=>submitForm(f,async()=>{agentState=await api('/api/agent-settings',{agent:f.elements.agent.value,model:f.elements.model.value,effort:f.elements.effort.value});drawAgentSummary();$('agent-status').textContent='Saved. New verifications and report drafts will use '+agentState.agent+(agentState.model?' with '+agentState.model:' with its default model')+'.';}).finally(agentControls));loadAgents().catch(fail);}
$('agent-settings').onclick=guard(showAgentSettings);loadAgentState().catch(fail);
$('new-example').onclick=showCreate;$('tree-filter').oninput=drawTree;catalog().catch(fail);setInterval(async()=>{if(polling)return;polling=true;try{await refresh();}catch(e){fail(e);}finally{polling=false;}},3000);
