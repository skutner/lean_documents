<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Proof Process Viewer</title>
<style>
:root {
  --bg: #f4f6f9; --surface: #ffffff; --text: #1f2937; --muted: #4b5563; --line: #dde3ec; --soft: #eef1f6;
  --inputs: #1d5fa8; --inputs-tint: #edf4fc;
  --process: #6d3fb5; --process-tint: #f4effb;
  --results: #0f766e; --results-tint: #e9f6f3;
  --ok: #166534; --ok-tint: #e6f4ea;
  --bad: #b42318; --bad-tint: #fdecea;
  --warn: #8a4a00; --warn-tint: #fff1dc;
  --run: #1d4ed8; --run-tint: #e8efff;
  --neutral: #475569; --neutral-tint: #eceff4;
  --focus: #1d4ed8;
  --radius: 14px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .6; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
.muted { color: var(--muted); }
.icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 30; background: var(--surface); border: 2px solid var(--focus); border-radius: 8px; padding: 8px 14px; }
.skip:focus { top: 8px; }

/* Layout */
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 100vh; }
#side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 16px 28px; }
.side-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
.brand .icon { width: 1.8em; height: 1.8em; color: var(--process); }
.ghost { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; color: var(--muted); font-size: .9rem; }
.ghost:hover { background: var(--soft); color: var(--text); }
.narrow-only { display: none; }
main { min-width: 0; padding: 36px clamp(16px, 4vw, 52px) 80px; max-width: 1120px; width: 100%; margin: 0 auto; }
main:focus { outline: none; }
.side-section { margin-bottom: 26px; }
.side-section h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.05rem; }
.side-section h2 .icon { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .85rem; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.group { margin-bottom: 14px; }
.group h3 { margin: 6px 4px 6px; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.run-btn, .dossier-btn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: start; width: 100%; text-align: left; background: var(--surface); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; margin-bottom: 2px; }
.run-btn:hover, .dossier-btn:hover { background: var(--soft); }
.run-btn[aria-current="page"], .dossier-btn[aria-current="page"] { background: var(--soft); border-color: var(--line); box-shadow: inset 4px 0 0 var(--process); }
.run-btn[hidden] { display: none; }
.run-btn .st-icon { grid-row: 1 / span 3; margin-top: 2px; }
.run-btn .st-icon .icon { width: 1.5em; height: 1.5em; }
.run-btn .st-word { font-weight: 700; font-size: .92rem; line-height: 1.3; }
.run-btn .st-word small { font-weight: 400; color: var(--muted); }
.run-btn .run-title { display: flex; gap: 6px; align-items: baseline; font-size: .95rem; line-height: 1.35; }
.run-btn .run-title .icon { width: 1em; height: 1em; color: var(--muted); align-self: center; }
.run-btn .run-when { color: var(--muted); font-size: .82rem; }
.dossier-btn .icon { width: 1.5em; height: 1.5em; color: var(--results); grid-row: 1 / span 2; }
.dossier-btn .d-name { font-weight: 700; }
.dossier-btn .d-meta { color: var(--muted); font-size: .85rem; }
.empty-note { color: var(--muted); font-size: .92rem; margin: 6px 4px; }

/* Tones, used for status and for steps */
.tone-running { --tone: var(--run); --tone-tint: var(--run-tint); }
.tone-ok { --tone: var(--ok); --tone-tint: var(--ok-tint); }
.tone-bad { --tone: var(--bad); --tone-tint: var(--bad-tint); }
.tone-warn { --tone: var(--warn); --tone-tint: var(--warn-tint); }
.tone-neutral { --tone: var(--neutral); --tone-tint: var(--neutral-tint); }
.st-icon, .st-word { color: var(--tone, var(--neutral)); }
.st-running .st-icon .icon { animation: spin 1.3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .st-running .st-icon .icon { animation: none; } * { scroll-behavior: auto !important; transition: none !important; } }

/* Run header */
.run-head { margin-bottom: 8px; }
.run-head h1 { margin: 0 0 4px; font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.2; }
.run-head .sub { margin: 0 0 16px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .9rem; line-height: 1.35; }
.chip .k { color: var(--muted); }
.chip .v { font-weight: 600; }
.chip .icon { color: var(--muted); }
.chip.status { background: var(--tone-tint); border-color: transparent; color: var(--tone); font-weight: 700; font-size: .95rem; }
.chip.status .icon { color: var(--tone); }
.chip.status .sub { font-weight: 400; }
.status-line { margin: 12px 0 0; color: var(--muted); }
.callouts { display: grid; gap: 10px; margin: 16px 0 0; }
.callout { display: flex; gap: 12px; align-items: flex-start; background: var(--soft); border-radius: 12px; padding: 12px 16px; }
.callout .icon { margin-top: 3px; color: var(--neutral); }
.callout.warn { background: var(--warn-tint); }
.callout.warn .icon { color: var(--warn); }
.callout p { margin: 0; }
.callout ul { margin: 6px 0 0; padding-left: 1.2rem; }

/* The three blocks */
.block { --accent: var(--inputs); --tint: var(--inputs-tint); background: var(--surface); border: 1px solid var(--line); border-left: 8px solid var(--accent); border-radius: var(--radius); padding: 22px clamp(14px, 3vw, 28px) 26px; margin: 28px 0 0; }
.block[data-block="process"], .block[data-block="linked"] { --accent: var(--process); --tint: var(--process-tint); }
.block[data-block="results"], .block[data-block="reports"] { --accent: var(--results); --tint: var(--results-tint); }
.block-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.block-badge { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--tint); color: var(--accent); flex: none; }
.block-badge .icon { width: 26px; height: 26px; }
.block-head h2 { margin: 0; font-size: 1.4rem; line-height: 1.2; color: var(--accent); }
.block-head p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.block .empty { color: var(--muted); margin: 6px 0; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; }
.card { background: var(--tint); border: 1px solid transparent; border-radius: 12px; min-width: 0; }
.card.static .card-head { cursor: default; }
.stack { display: grid; gap: 14px; }
.stack .card { background: var(--tint); }
details.card[open] { grid-column: 1 / -1; background: var(--surface); border-color: var(--accent); }
.card-head { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; list-style: none; cursor: pointer; border-radius: 12px; }
.card-head::-webkit-details-marker { display: none; }
.card-head .kind-icon { color: var(--accent); margin-top: 2px; }
.card-main { min-width: 0; flex: 1; }
.card-title { font-weight: 650; line-height: 1.35; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; color: var(--muted); font-size: .86rem; }
.card-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mini { display: inline-flex; gap: 4px; padding: 1px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.mini b { color: var(--text); font-weight: 600; }
.badge-draft { background: var(--warn-tint); color: var(--warn); border-color: transparent; font-weight: 600; }
.chev { margin-left: auto; color: var(--muted); transition: transform .15s; margin-top: 3px; }
details[open] > summary .chev { transform: rotate(90deg); }
.body { border-top: 1px solid var(--line); padding: 16px clamp(12px, 2.5vw, 22px) 18px; min-width: 0; }
.body[aria-busy="true"] { opacity: .75; }
.body .more { margin-top: 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; }
.body .note { color: var(--muted); font-size: .88rem; margin: 10px 0 0; }
.body .callout { margin-bottom: 12px; }
.groups { display: grid; gap: 24px; }
.group-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 1rem; color: var(--text); }
.group-title .count { color: var(--muted); font-weight: 400; }
details.kept > summary { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 650; padding: 8px 0; list-style: none; }
details.kept > summary::-webkit-details-marker { display: none; }
details.kept > p { margin: 4px 0 12px; color: var(--muted); font-size: .92rem; }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--tone); background: var(--tone-tint); padding: 2px 12px 2px 8px; border-radius: 999px; font-size: .88rem; }

/* Process timeline */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.toolbar .total { margin-left: auto; color: var(--muted); font-size: .9rem; }
.toolbar button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: .88rem; color: var(--muted); }
.toolbar button[aria-pressed="true"] { background: var(--process); border-color: var(--process); color: #fff; }
.timeline { list-style: none; margin: 0; padding: 0; }
.entry { position: relative; display: grid; grid-template-columns: 82px 34px minmax(0, 1fr); column-gap: 14px; padding-bottom: 14px; }
.entry::before { content: ""; position: absolute; left: calc(82px + 14px + 16px); top: 34px; bottom: 0; width: 2px; background: var(--line); }
.entry:last-child::before { display: none; }
.entry-time { grid-column: 1; text-align: right; padding-top: 6px; font-size: .85rem; color: var(--muted); line-height: 1.3; font-variant-numeric: tabular-nums; }
.entry-time .off { display: block; }
.entry-dot { grid-column: 2; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--tone-tint); color: var(--tone); border: 2px solid var(--tone); }
.entry-dot .icon { width: 18px; height: 18px; }
.entry-main { grid-column: 3; min-width: 0; }
.entry-details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.entry-details[open] { border-color: var(--process); }
.entry-head { display: block; padding: 8px 14px; border: 1px solid transparent; }
summary.entry-head { display: flex; align-items: flex-start; gap: 10px; list-style: none; cursor: pointer; border-radius: 12px; }
summary.entry-head::-webkit-details-marker { display: none; }
.entry-text { min-width: 0; flex: 1; }
.entry-title { font-weight: 650; line-height: 1.35; }
.entry-summary { color: var(--muted); font-size: .92rem; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
details[open] > summary .entry-summary { display: block; -webkit-line-clamp: unset; }
.entry.tone-bad .entry-title { color: var(--bad); }
.timeline[data-filter="messages"] .entry:not([data-group="messages"]),
.timeline[data-filter="command"] .entry:not([data-group="command"]),
.timeline[data-filter="host"] .entry:not([data-group="host"]),
.timeline[data-filter="diag"] .entry:not([data-group="diag"]) { display: none; }

/* Rendered text */
.md { line-height: 1.65; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 12px; }
.md h3, .md h4, .md h5, .md h6 { margin: 22px 0 8px; line-height: 1.3; }
.md h3 { font-size: 1.3rem; } .md h4 { font-size: 1.15rem; } .md h5 { font-size: 1.02rem; } .md h6 { font-size: .95rem; color: var(--muted); }
.md ul, .md ol { margin: 0 0 12px; padding-left: 1.5rem; }
.md li { margin: 4px 0; }
.md li > ul, .md li > ol { padding-left: 1.1rem; }
.md li li li li > ul, .md li li li li > ol { padding-left: 0; }
.md li > p { margin: 0 0 6px; }
.md blockquote { margin: 10px 0 14px; padding: 8px 16px; border-left: 4px solid var(--accent, #64748b); background: #f6f8fb; border-radius: 0 10px 10px 0; color: #1f2937; }
.md blockquote > :last-child { margin-bottom: 0; }
.md blockquote blockquote { padding: 4px 0 4px 10px; }
.md blockquote blockquote blockquote blockquote { padding-left: 0; border-left: 0; }
.md code { font: .88em ui-monospace, Menlo, Consolas, monospace; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.md .url { color: var(--muted); }
.md p.deep { white-space: pre-wrap; }
.code-wrap, .table-wrap { overflow-x: auto; margin: 0 0 14px; max-width: 100%; }
.md pre { margin: 0; padding: 12px 14px; background: #f6f8fb; border: 1px solid var(--line); border-radius: 10px; white-space: pre; font: .86rem/1.5 ui-monospace, Menlo, Consolas, monospace; }
.md pre code { background: none; padding: 0; font: inherit; }
.md table { border-collapse: collapse; min-width: 100%; font-size: .92rem; }
.md th, .md td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; min-width: 7rem; }
.md th { background: var(--soft); font-weight: 650; position: sticky; top: 0; }
pre.plain { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: .88rem/1.55 ui-monospace, Menlo, Consolas, monospace; background: #f6f8fb; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; max-height: 34rem; overflow: auto; }

/* Dossier page */
.warning { display: flex; gap: 12px; background: var(--warn-tint); border-radius: 12px; padding: 14px 18px; margin: 18px 0 0; color: #3d2400; }
.warning .icon { color: var(--warn); margin-top: 3px; }
.warning p { margin: 0; }
.dl-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; background: var(--results); color: #fff; border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 600; }
.dl-btn:hover { background: #0b5e57; }
.report-block { display: grid; gap: 4px; justify-items: start; }
.report-block > details { width: 100%; }
.link-list { display: grid; gap: 8px; }
.link-btn { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; text-align: left; background: var(--results-tint); border: 1px solid transparent; border-radius: 12px; padding: 10px 14px; }
.link-btn:hover { border-color: var(--results); }
.link-btn .match { color: var(--muted); font-size: .88rem; }

/* Welcome, notices, settings, alerts */
.welcome h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.3rem); }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; margin: 26px 0; }
.legend > div { background: var(--surface); border: 1px solid var(--line); border-left: 8px solid var(--accent); border-radius: var(--radius); padding: 16px 18px; }
.legend .l-inputs { --accent: var(--inputs); } .legend .l-process { --accent: var(--process); } .legend .l-results { --accent: var(--results); }
.legend h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 1.15rem; color: var(--accent); }
.legend p { margin: 0; color: var(--muted); }
.key-box { max-width: 34rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
.key-box h1 { margin: 0 0 8px; font-size: 1.5rem; }
#settings-panel { position: fixed; z-index: 20; top: 16px; right: 16px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 40px rgba(15, 23, 42, .22); padding: 20px 22px; }
#settings-panel[hidden] { display: none; }
#settings-panel h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.2rem; }
#settings-panel dl { margin: 0; }
#settings-panel dt { font-weight: 650; margin-top: 12px; }
#settings-panel dd { margin: 2px 0 0; color: var(--muted); }
#settings-panel pre { margin: 6px 0 0; padding: 10px 12px; background: #f6f8fb; border: 1px solid var(--line); border-radius: 10px; font: .82rem/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
#settings-panel .close { float: right; }
#alert { position: fixed; z-index: 25; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, .3); }
#alert[hidden] { display: none; }

/* Narrow screens */
@media (max-width: 860px) {
  .layout { display: block; }
  #side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 14px 16px; }
  .side-top { margin-bottom: 0; }
  .narrow-only { display: inline-flex; }
  body.view-open:not(.nav-open) #side-body { display: none; }
  body:not(.view-open) .narrow-only { display: none; }
  #side-body { margin-top: 16px; }
  main { padding: 22px 14px 64px; }
  .block { padding: 18px 12px 20px; border-left-width: 6px; }
  .block-head { gap: 10px; }
  .block-badge { width: 40px; height: 40px; }
  .entry { grid-template-columns: 34px minmax(0, 1fr); grid-template-areas: "dot time" "dot main"; column-gap: 12px; }
  .entry::before { left: 16px; }
  .entry-time { grid-area: time; text-align: left; padding-top: 0; margin-bottom: 4px; }
  .entry-time .off { display: inline; margin-left: 8px; }
  .entry-dot { grid-area: dot; }
  .entry-main { grid-area: main; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .legend { margin: 18px 0; }
  .md th, .md td { min-width: 6rem; padding: 6px 8px; }
  #settings-panel { top: 8px; right: 8px; width: calc(100vw - 16px); }
}
</style>
</head>

      var before = S.known[r.key];
      if (before !== undefined && before !== r.status && !S.firstRuns) changes.push((r.title || r.key) + ': ' + (r.statusLabel || statusOf(r.status).word));
      S.known[r.key] = r.status;
    });
    S.firstRuns = false;
    if (changes.length) $('live').textContent = changes.join('. ');
  }
  function refreshRuns() {
    return api('/api/runs').then(function (list) {
      var changed = sig(list) !== S.runsSig;
      if (changed) {
        announce(list);
        S.runs = list;
        S.runsSig = sig(list);
        renderRuns();
        if (S.view && S.view.type === 'welcome' && main._welcomeSig !== welcomeSig(list.length, list.filter(function (r) { return r.status === 'running'; }).length)) renderWelcome();
      }
      return changed;
    });
  }
  function refreshDossiers(force) {
    if (!force && !(S.view && S.view.type === 'dossier') && S.dossiers.length) return Promise.resolve();
    return api('/api/dossiers').then(function (list) {
      if (sig(list) !== S.dossiersSig) { S.dossiers = list; S.dossiersSig = sig(list); renderDossierList(); }
    });
  }
  function refreshView() {
    var v = S.view;
    if (!v) return Promise.resolve();
    if (v.type === 'run') {
      var gen = v.gen;
      return api('/api/runs/' + enc(v.pid) + '/' + enc(v.rid)).then(function (data) {
        if (gen !== S.gen) return null;
        var listed = null;
        for (var i = 0; i < S.runs.length; i++) if (S.runs[i].key === v.key) listed = S.runs[i];
        patchRun(v, data, listed);
        return loadTimeline(v).then(function () { if (gen === S.gen) refreshOpenBodies(v.running); });
      }, function (error) {
        if (gen !== S.gen) return null;
        if (error.status === 404) {
          fill(main, h('div', {class: 'key-box'}, h('h1', {text: 'This run is not there'}), h('p', {class: 'muted', text: error.message}), h('p', {class: 'muted', text: 'Choose another run on the left.'})));
          S.view = {type: 'gone', gen: S.gen};
          return null;
        }
        throw error;
      });
    }
    if (v.type === 'dossier') {
      return refreshDossiers(true).then(function () {
        if (v.gen !== S.gen) return;
        var d = null;
        for (var i = 0; i < S.dossiers.length; i++) if (S.dossiers[i].n === v.n) d = S.dossiers[i];
        if (!d) {
          fill(main, h('div', {class: 'key-box'}, h('h1', {text: 'This dossier is not there'}), h('p', {class: 'muted', text: 'Choose another dossier on the left.'})));
          S.view = {type: 'gone', gen: S.gen};
          return;
        }
        patchDossier(v, d);
      });
    }
    return Promise.resolve();
  }
  /** The status is asked for again at every poll, so that a viewer that restarted with other facts (Deep Proof recording or not) shows them. */
  function refreshStatus() {
    return api('/api/status').then(function (st) {
      S.status = st;
      if (S.view && S.view.type === 'welcome' && main._welcomeSig !== welcomeSig(S.runs.length, S.runs.filter(function (r) { return r.status === 'running'; }).length)) renderWelcome();
    });
  }
  function poll() {
    clearTimeout(S.timer);
    var id = S.pollId = (S.pollId || 0) + 1;
    enqueue(function () {
      return refreshStatus().then(refreshRuns).then(function (changed) { return changed ? refreshDossiers(true) : refreshDossiers(false); }).then(refreshView).then(function () {
        showAlert('');
        S.polls += 1;
        document.body.setAttribute('data-poll-count', String(S.polls));
      });
    }).then(function () {
      if (id === S.pollId) S.timer = setTimeout(poll, S.pollMs);
    });
  }

  function start() {
    api('/api/status').then(function (st) {
      S.status = st;
      S.pollMs = st.pollMs > 500 ? st.pollMs : 3000;
      S.view = null;
      S.known = {}; S.firstRuns = true; S.runsSig = ''; S.dossiersSig = '';
      return refreshRuns().then(function () { return refreshDossiers(true); });
    }).then(function () {
      var r = parseRoute();
      S.view = null;
      if (r.type === 'welcome') { S.view = {type: 'welcome', gen: ++S.gen}; document.body.classList.remove('view-open'); setNavState(true); renderWelcome(); }
      else route();
      poll();
    }).catch(function (error) { showAlert(error.message); S.timer = setTimeout(start, 3000); });
  }

  // ---------- Wiring ----------
  $('skip').addEventListener('click', function () { main.focus(); });
  $('settings-open').addEventListener('click', function () { if ($('settings-panel').hidden) openSettings(); else closeSettings(); });
  $('nav-toggle').addEventListener('click', function () { setNavState(!document.body.classList.contains('nav-open')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('settings-panel').hidden) closeSettings(); });
  window.addEventListener('hashchange', route);

  setNavState(true);
  start();
})();
</script>
</body>
</html>
